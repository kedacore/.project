name: Validate Project Metadata

on:
  pull_request:
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
      - '.github/workflows/validate.yaml'
  push:
    branches: [main]
    paths:
      - 'project.yaml'
      - 'maintainers.yaml'
      - '.github/workflows/validate.yaml'
  workflow_dispatch:

jobs:
  validate-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-project@d7d25c42f9247f6e4a0f0a99344432c3bbf3447d
        with:
          project_file: 'project.yaml'

  validate-maintainers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cncf/automation/.github/actions/validate-maintainers@d7d25c42f9247f6e4a0f0a99344432c3bbf3447d
        with:
          maintainers_file: 'maintainers.yaml'
          # Disabled until the upstream LFX long-lived token issue is resolved:
          # https://github.com/cncf/automation/issues/293
          verify_maintainers: 'false'
        env:
          LFX_AUTH_TOKEN: ${{ secrets.LFX_AUTH_TOKEN }}
